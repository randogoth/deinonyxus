# DankSearch Configuration
# Includes system/user desktop entry locations so DMS launcher can find apps.

index_path = "~/.cache/danksearch/index"
listen_addr = ":43654"
max_file_bytes = 2097152
worker_count = 7
text_extensions = [".txt", ".md", ".go", ".py", ".js", ".ts", ".jsx", ".tsx", ".json", ".yaml", ".yml", ".toml", ".html", ".css", ".rs", ".c", ".cpp", ".h", ".java", ".rb", ".php", ".sh", ".desktop"]
index_all_files = true
max_depth = 0

[[index_paths]]
  path = "~"
  max_depth = 6
  exclude_hidden = true
  exclude_dirs = ["node_modules", "bower_components", ".npm", ".yarn", "site-packages", "__pycache__", ".venv", "venv", ".tox", ".pytest_cache", ".eggs", "dist", "build", "out", "bin", "obj", "target", "vendor", ".gradle", ".m2", "bundle", ".cache", ".parcel-cache", ".next", ".nuxt", ".serverless", "Library", ".Trash-1000", ".postgresql", ".postgres", ".mysql", ".mongodb", ".redis", "pgdata", "pg_data", "go", ".cargo", ".pyenv", ".rbenv", ".nvm", ".rustup", ".composer", ".gem", ".idea", ".vscode"]
  extract_exif = true

[[index_paths]]
  path = "/usr/share/applications"
  max_depth = 2
  exclude_hidden = true
  extract_exif = false

[[index_paths]]
  path = "/var/lib/flatpak/exports/share/applications"
  max_depth = 2
  exclude_hidden = true
  extract_exif = false

[[index_paths]]
  path = "~/.local/share/applications"
  max_depth = 2
  exclude_hidden = true
  extract_exif = false

[[index_paths]]
  path = "~/.local/share/flatpak/exports/share/applications"
  max_depth = 2
  exclude_hidden = true
  extract_exif = false
