[General]
# Enable the Wayland-native capture backend.
useGrimAdapter=true
# Close the background daemon when idle.
autoCloseIdleDaemon=true
# Launch on login for quick captures.
startupLaunch=true
# Default save format.
saveAsFileExtension=jpg
# DMS-aligned colors (dark mode defaults).
uiColor=#d0bcff
contrastUiColor=#381e72
drawColor=#d0bcff
contrastOpacity=188
uiLanguage=auto
checkForUpdates=false
disabledTrayIcon=true
saveLastRegion=true
showStartupLaunchMessage=false